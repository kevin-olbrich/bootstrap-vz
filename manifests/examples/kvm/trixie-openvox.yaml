---
name: debian-{system.release}-{system.architecture}-{%Y}{%m}{%d}
provider:
  name: kvm
  virtio:
    - virtio_pci
    - virtio_blk
bootstrapper:
  workspace: /target
system:
  release: trixie
  architecture: amd64
  bootloader: grub
  charmap: UTF-8
  locale: en_US
  timezone: UTC
volume:
  backing: raw
  partitions:
    type: msdos
    root:
      filesystem: ext4
      size: 10GiB
packages:
  install_standard: true
  mirror: http://deb.debian.org/debian
  install:
    # required to be pre-installed for proper functioning of the
    # puppetlabs-apt module, it is also the primary Puppet module
    - lsb-release
plugins:
  # It is advisable to avoid running things as root, use a sudo account instead
  admin_user:
    username: administrator
    password: something
  # OpenVox plugin
  openvox:
    # The assets path MUST be ABSOLUTE on your project.
    assets: /your/absolute/path/to/etc/puppetlabs
    install_modules:
      - [puppetlabs-accounts]
      - [puppetlabs-apt]
      - [puppetlabs-concat]
      - [puppetlabs-stdlib]
      - [puppetlabs-apache]
