---
name: disk
provider:
  name: gce
  description: Debian {system.release} {system.architecture}
bootstrapper:
  workspace: /target
system:
  release: bookworm
  architecture: amd64
  bootloader: grub
  charmap: UTF-8
  locale: en_US
  timezone: UTC
volume:
  backing: raw
  partitions:
    type: msdos
    root:
      filesystem: ext4
      size: 10GiB
packages:
  sources:
    google-cloud:
      - deb http://packages.cloud.google.com/apt google-compute-engine-{system.release}-stable main
  install:
    # The guest environment. google-compute-engine depends on google-guest-agent, which conflicts with
    # the python-google-compute-engine and python3-google-compute-engine packages of the older GCE manifests.
    - google-compute-engine
    - google-osconfig-agent
plugins:
  expand_root:
    filesystem_type: ext4
    root_device: /dev/sda
    root_partition: 1
  # Installs the key of packages.cloud.google.com
  google_cloud_repo: {}
  ntp:
    servers:
      - metadata.google.internal
