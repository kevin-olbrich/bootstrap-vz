---
name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  tox:
    name: tox -e ${{ matrix.toxenv }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toxenv: [flake8, pylint, yamllint, unit, integration, docs]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install tox
      - run: tox -e ${{ matrix.toxenv }}
