[tox]
envlist = flake8, pylint, yamllint, unit, integration, docs
requires = tox-uv >= 1.20

[flake8]
ignore = E221,E241,E501,W504
max-line-length = 110

# Install every env from uv.lock with the dependency group from pyproject.toml
[testenv]
runner = uv-venv-lock-runner
package = wheel
basepython = python3.13

[pytest]
python_files = *_tests.py

[testenv:flake8]
dependency_groups = flake8
commands = flake8 bootstrapvz/ tests/ {posargs}

[testenv:pylint]
dependency_groups = pylint
commands = pylint bootstrapvz/ tests/

[testenv:unit]
dependency_groups = test
commands = pytest --verbose {posargs:tests/unit}

[testenv:integration]
dependency_groups = test
commands = pytest --verbose {posargs:tests/integration}

[testenv:system]
dependency_groups = system
commands = pytest --html=system.html --verbose {posargs:tests/system}

[testenv:docs]
changedir = docs
dependency_groups = docs
commands = sphinx-build -W -b html -d _build/html/doctrees . _build/html

[testenv:yamllint]
dependency_groups = yamllint
commands = yamllint manifests
