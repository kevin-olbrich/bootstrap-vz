default l0
prompt 1
timeout 50


label l0
	menu label Debian GNU/Linux
	linux {boot_prefix}/vmlinuz
	append initrd={boot_prefix}/initrd.img root=UUID={root_uuid} ro quiet console=ttyS0

label l0r
	menu label Debian GNU/Linux (recovery mode)
	linux {boot_prefix}/vmlinuz
	append initrd={boot_prefix}/initrd.img root=UUID={root_uuid} ro console=ttyS0 single
	text help
   This option boots the system into recovery mode (single-user)
	endtext
