---
$schema: http://json-schema.org/draft-04/schema#
title: Install Docker plugin manifest
type: object
properties:
  system:
    type: object
    properties:
      architecture:
        type: string
        enum: [amd64, arm64]
      release:
        type: string
  plugins:
    type: object
    properties:
      docker_daemon:
        type: object
        properties:
          version:
            pattern: '^\d+\.\d+\.\d+$'
            type: string
          docker_opts:
            type: string
          pull_images:
            type: array
            items:
              type: string
          pull_images_retries:
            type: integer
            minimum: 1
        additionalProperties: false
