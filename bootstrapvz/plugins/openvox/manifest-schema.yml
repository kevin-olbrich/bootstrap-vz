---
$schema: http://json-schema.org/draft-04/schema#
title: OpenVox plugin manifest
type: object
properties:
  plugins:
    type: object
    properties:
      openvox:
        type: object
        properties:
          assets: {$ref: '#/definitions/absolute_path'}
          collection:
            type: string
            pattern: ^openvox[0-9]+$
          enable_agent: {type: boolean}
          manifest: {$ref: '#/definitions/absolute_path'}
          install_modules:
            type: array
            minItems: 1
            items:
              type: array
              minItems: 1
              maxItems: 2
              items:
                - type: string
                  pattern: ^[^/]+(/[^/]+)?$
                - type: [string, number]
        minProperties: 1
        additionalProperties: false
definitions:
  absolute_path:
    pattern: ^/[^\0]+$
    type: string
